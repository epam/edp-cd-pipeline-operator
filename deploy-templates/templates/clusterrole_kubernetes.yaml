{{- if eq .Values.global.platform "kubernetes" -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "cd-pipeline-operator.labels" . | nindent 4 }}
  name: edp-{{ .Values.name }}-{{ .Release.Namespace }}
rules:
# Stage target namespaces are arbitrary: cluster-scoped.
# get is required in both modes; manageNamespace=false reads a pre-created
# namespace through CheckNamespaceExist.
- apiGroups:
    - ""
  resources:
    - namespaces
  verbs:
    - get
{{- if and (eq .Values.tenancyEngine "none") .Values.manageNamespace }}
# tenancyEngine=capsule keeps these off the cluster scope: the Tenant owner
# binding grants create, and Capsule binds capsule-namespace-deleter inside each
# adopted namespace for delete.
    - create
    - delete
{{- end }}
{{- end -}}
