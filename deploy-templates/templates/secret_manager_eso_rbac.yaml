{{- if eq .Values.secretManager "eso" -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secret-integration
  labels:
      {{- include "cd-pipeline-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [ "" ]
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create

---

# Bound by the operator to the per-Stage secret-manager ServiceAccount.
# bind lets it grant selfsubjectrulesreviews without holding it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manage-external-secret-integration
  labels:
      {{- include "cd-pipeline-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [ "rbac.authorization.k8s.io" ]
    resources:
      - roles
    resourceNames:
      - external-secret-integration
    verbs:
      - get
      - bind

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: manage-external-secret-integration-binding
  labels:
    {{- include "cd-pipeline-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: manage-external-secret-integration
subjects:
  - kind: ServiceAccount
    name: edp-{{ .Values.name }}
    namespace: {{ .Release.Namespace }}

---

# Provisioned once per Stage target namespace: create only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
      {{- include "cd-pipeline-operator.labels" . | nindent 4 }}
  name: external-secrets-manager-{{ .Release.Namespace }}
rules:
# Not part of the built-in admin ClusterRole, so this stays cluster-scoped for
# every tenancyEngine.
  - apiGroups:
      - external-secrets.io
    resources:
      - secretstores
      - externalsecrets
    verbs:
      - create
{{- if eq .Values.tenancyEngine "none" }}
# Covered by the Capsule admin binding when tenancyEngine=capsule.
  - apiGroups:
        - ""
    resources:
      - serviceaccounts
    verbs:
      - create
{{- end }}

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "cd-pipeline-operator.labels" . | nindent 4 }}
  name: external-secrets-manager-rolebinding-{{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-manager-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: edp-{{ .Values.name }}
    namespace: {{ .Release.Namespace }}

{{- end -}}
