apiVersion: v2.edp.epam.com/v1
kind: CDPipeline
metadata:
  name: unm-pipeline
spec:
  applications: [test]
  applicationsToPromote: [test]
  deploymentType: container
  inputDockerStreams: [test-main]
  name: unm-pipeline
  description: unm-pipeline description
---
apiVersion: v2.edp.epam.com/v1
kind: Stage
metadata:
  name: unm-dev
spec:
  cdPipeline: unm-pipeline
  clusterName: in-cluster
  description: Development Environment
  name: dev
  namespace: unm-target-dev
  order: 0
  qualityGates:
    - qualityGateType: manual
      stepName: approve
  source:
    type: default
  triggerType: Manual
  triggerTemplate: deploy
---
apiVersion: v2.edp.epam.com/v1
kind: Codebase
metadata:
  name: test
spec:
  buildTool: go
  ciTool: tekton
  defaultBranch: main
  deploymentScript: helm-chart
  description: app1
  emptyProject: false
  framework: gin
  gitServer: gerrit
  gitUrlPath: /test
  lang: go
  strategy: create
  type: application
  versioning: {type: default}
---
apiVersion: v2.edp.epam.com/v1
kind: GitServer
metadata:
  name: gerrit
spec:
  gitHost: gerrit-dev
  gitProvider: gerrit
  gitUser: git
  httpsPort: 443
  nameSshKeySecret: gerrit-ciuser-sshkey
  sshPort: 30000

---

apiVersion: v2.edp.epam.com/v1
kind: Codebase
metadata:
  name: gitops
  labels:
    "app.edp.epam.com/codebaseType": "system"
    "app.edp.epam.com/systemType": "gitops"
spec:
  buildTool: helm
  ciTool: tekton
  defaultBranch: main
  deploymentScript: helm-chart
  description: Custom values for deploy applications
  emptyProject: false
  framework: gitops
  gitServer: gerrit
  gitUrlPath: /edp-gitops
  jiraIssueMetadataPayload: null
  lang: helm
  strategy: create
  type: system
  versioning:
    startFrom: 0.1.0-SNAPSHOT
    type: semver

---

apiVersion: v2.edp.epam.com/v1
kind: CodebaseImageStream
metadata:
  name: test-main
  labels:
    app.edp.epam.com/codebasebranch: test-main
spec:
  codebase: test
  imageName: registry.host.local/registry-space/test
