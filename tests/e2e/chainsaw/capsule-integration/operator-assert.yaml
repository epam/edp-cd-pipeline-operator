apiVersion: apps/v1
kind: Deployment
metadata:
  name: cd-pipeline-operator
status:
  readyReplicas: 1
---
apiVersion: capsule.clastix.io/v1beta2
kind: Tenant
metadata:
  name: edp-workload-krci
status:
  size: 0
  state: Active
spec:
  # Owners only; Capsule defaults the other spec fields.
  owners:
    - clusterRoles:
        - admin
        - capsule-namespace-deleter
      kind: ServiceAccount
      name: system:serviceaccount:krci:edp-cd-pipeline-operator

---
# cainjector sets caBundle after `helm install --wait` returns.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: (join('-', ['edp-cd-pipeline-operator-validating-webhook-configuration', $namespace]))
(length(webhooks) > `0`): true
(length(webhooks[?!clientConfig.caBundle])): 0

---
# Ready endpoint means the webhook server is listening (readyz gate).
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  labels:
    kubernetes.io/service-name: edp-cd-pipeline-operator-webhook-service
(length((endpoints || `[]`)[?conditions.ready]) > `0`): true
