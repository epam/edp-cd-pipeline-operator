apiVersion: apps/v1
kind: Deployment
metadata:
  name: capsule-controller-manager
  namespace: capsule-system
status:
  readyReplicas: 1

# ClusterRole is created by capsule-operator and guarantees that webhook is configured properly
# and capsule-operator is ready to process requests
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capsule-namespace-deleter
rules:
  - verbs:
      - delete
    apiGroups:
      - ''
    resources:
      - namespaces

# Operator ServiceAccounts are Capsule users via system:serviceaccounts:krci.
---
apiVersion: capsule.clastix.io/v1beta2
kind: CapsuleConfiguration
metadata:
  name: default
spec:
  users:
    - kind: Group
      name: projectcapsule.dev
    - kind: Group
      name: capsule.clastix.io
    - kind: Group
      name: system:serviceaccounts:krci
