apiVersion: apps/v1
kind: Deployment
metadata:
  name: capsule-controller-manager
  namespace: capsule-system
status:
  readyReplicas: 1

# ClusterRole is created by capsule-operator and guarantees that webhook is configured properly
# and capsule-operator is ready to process requests
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capsule-namespace-deleter
rules:
  - verbs:
      - delete
    apiGroups:
      - ''
    resources:
      - namespaces

# The tenant owner group is registered via spec.users (the deprecated
# capsuleUserGroups/userNames Helm keys are not used), so ServiceAccounts
# under system:serviceaccounts:krci are recognized as Capsule identities.
---
apiVersion: capsule.clastix.io/v1beta2
kind: CapsuleConfiguration
metadata:
  name: default
spec:
  users:
    - kind: Group
      name: capsule.clastix.io
    - kind: Group
      name: system:serviceaccounts:krci
