apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: capsule-integration
spec:
  steps:
  - name: install-capsule-operator
    try:
    - script:
        content: |
          set -e
          
          helm repo add projectcapsule https://projectcapsule.github.io/charts
          helm repo update

          # Version, users and TLS settings mirror edp-cluster-add-ons
          # (clusters/core/addons/capsule/values.yaml). Bump both together.
          # TLS: Capsule's own controller; cert-manager is installed later.
          helm install --replace capsule projectcapsule/capsule --version 0.14.3 \
          --set 'manager.options.users[0].kind=Group' \
          --set 'manager.options.users[0].name=projectcapsule.dev' \
          --set 'manager.options.users[1].kind=Group' \
          --set 'manager.options.users[1].name=capsule.clastix.io' \
          --set 'manager.options.users[2].kind=Group' \
          --set 'manager.options.users[2].name=system:serviceaccounts:krci' \
          --set 'certManager.generateCertificates=false' \
          --set 'tls.create=true' \
          --set 'tls.enableController=true' \
          --wait \
          --create-namespace \
          --namespace capsule-system
        timeout: 2m  
        check:
          ($error == null): true
    - assert:
        # Verify Capsule Operator
        file: install-capsule-operator-assert.yaml    
    cleanup:
    - script:
        content: |
          set -e
          helm uninstall capsule -n capsule-system

          # Block until Capsule webhook configurations are gone; leftovers
          # intercept namespace operations in the next suite.
          for i in $(seq 1 60); do
            all=$(kubectl get validatingwebhookconfigurations,mutatingwebhookconfigurations -o name)
            left=$(printf '%s\n' "$all" | grep -c capsule || true)
            [ "$left" -eq 0 ] && exit 0
            sleep 1
          done
          echo "capsule webhook configurations did not clear in time" >&2
          exit 1
        timeout: 3m
        check:
          ($error == null): true
  - name: install-krci-dependencies
    try:  
    - script:
        content: |
          set -e
          
          # Shared pre-install: the first suite to run pulls the CRDs, the rest
          # skip it. Chainsaw has no global setup hook and test order is not
          # deterministic, so every suite carries the same guarded step.
          if ! kubectl get crd codebases.v2.edp.epam.com >/dev/null 2>&1; then
            base=https://raw.githubusercontent.com/epam/edp-codebase-operator/master/deploy-templates/crds
            kubectl apply -f $base/v2.edp.epam.com_codebaseimagestreams.yaml
            kubectl apply -f $base/v2.edp.epam.com_codebases.yaml
            kubectl apply -f $base/v2.edp.epam.com_gitservers.yaml
          fi
          if ! kubectl get crd applicationsets.argoproj.io >/dev/null 2>&1; then
            kubectl apply -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.9.3/manifests/crds/applicationset-crd.yaml
          fi
        timeout: 30s
    - apply:
        file: krci-config.yaml
        expect:
          - match:
              kind: ConfigMap
              metadata:
                name: krci-config
              data:
                container_registry_host: registry.host.local
                container_registry_space: registry-space
            check:
              ($error == null): true
    - apply:
        file: test-main-cis.yaml
        expect:
          - match:
              kind: CodebaseImageStream
              metadata:
                name: test-main
              spec:
                codebase: test
                imageName: registry.host.local/registry-space/test
                tags:
                  - created: '2023-10-19T14:05:05Z'
                    name: 0.1.0-SNAPSHOT.1
            check:
              ($error == null): true
  - name: install-cert-manager
    try:
    - script:
        content: |
          set -e

          helm status cert-manager -n cert-manager >/dev/null 2>&1 || \
          helm install cert-manager oci://quay.io/jetstack/charts/cert-manager \
            --version v1.20.2 \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --set prometheus.enabled=false \
            --wait
        timeout: 3m
        check:
          ($error == null): true
  - name: install-cd-pipeline-operator
    try:
    - script:
        bindings:
        - name: image_repository
          value: (join('/', [env('CONTAINER_REGISTRY_URL'), env('CONTAINER_REGISTRY_SPACE'), env('E2E_IMAGE_REPOSITORY')]))
        - name: image_tag
          value: (env('E2E_IMAGE_TAG'))
        env:
        - name: IMAGE_REPOSITORY
          value: ($image_repository)
        - name: E2E_IMAGE_TAG
          value: ($image_tag)
        - name: NAMESPACE
          value: ($namespace)
        content: |
          set -e
          helm uninstall cd-pipeline-operator-e2e -n $NAMESPACE --wait 2>/dev/null || true

          helm install --replace --set image.repository=$IMAGE_REPOSITORY \
          --set image.tag=$E2E_IMAGE_TAG \
          --set tenancyEngine=capsule \
          --namespace $NAMESPACE \
          --wait \
          cd-pipeline-operator-e2e ../../../../deploy-templates
        timeout: 3m
        check:
          ($error == null): true
    - assert:
        # Verify Operator Deployment, Tenant, and webhook readiness
        file: operator-assert.yaml
        timeout: 1m
    cleanup:
    - script:
        env:
        - name: NAMESPACE
          value: ($namespace)
        content: |
          helm uninstall cd-pipeline-operator-e2e -n $NAMESPACE --wait 2>/dev/null || true
        timeout: 2m
  - name: create-cdpipeline-and-stages
    try:  
    # Create CDPipeline and Stages
    - apply:
        file: cdpipeline-and-stages.yaml
        # Stage CREATE goes through the operator webhook.
        timeout: 30s
    # Wait for CDPipeline and Stages to be processed
    - sleep:
        duration: 30s
    # Verify CDPipeline and Stages
    - assert:
        file: cdpipeline-and-stages-assert.yaml      
  - name: assert-tenant-isolation
    description: |
      Capsule is the isolation engine. The operator must hold no cluster-scoped
      namespace lifecycle rights and no way to grant itself admin outside its
      Tenant. These are the only checks that can fail on over-granting.
    try:
    - script:
        content: |
          set -e
          SA=system:serviceaccount:krci:edp-cd-pipeline-operator
          kubectl create namespace foreign-app --dry-run=client -o yaml | kubectl apply -f -

          deny () {
            got=$(kubectl auth can-i "$@" --as=$SA 2>/dev/null || true)
            if [ "$got" != "no" ]; then
              echo "ESCAPE PATH OPEN: 'kubectl auth can-i $*' returned $got"
              exit 1
            fi
          }
          deny bind clusterroles/admin
          deny create rolebindings --namespace=foreign-app
          deny create secrets --namespace=foreign-app
          deny get secrets --namespace=foreign-app
          deny delete namespaces
          deny delete namespaces/kube-system
        timeout: 1m
        check:
          ($error == null): true
    - script:
        content: |
          set -e
          SA=system:serviceaccount:krci:edp-cd-pipeline-operator
          allow () {
            got=$(kubectl auth can-i "$@" --as=$SA 2>/dev/null || true)
            if [ "$got" != "yes" ]; then
              echo "KRCI MANAGEMENT BROKEN: 'kubectl auth can-i $*' returned $got"
              exit 1
            fi
          }
          allow create rolebindings --namespace=krci-mypipeline-dev
          allow delete namespaces --namespace=krci-mypipeline-dev
        timeout: 1m
        check:
          ($error == null): true
    cleanup:
    - script:
        content: kubectl delete namespace foreign-app --ignore-not-found
        timeout: 1m

  - name: reject-preexisting-namespace-adoption
    description: |
      An existing namespace cannot be bound to a Tenant by relabeling.
      Capsule allows this only for CapsuleConfiguration.spec.administrators,
      which this suite does not set.
    try:
    - script:
        content: |
          kubectl create namespace preexisting-adoption-test --dry-run=client -o yaml | kubectl apply -f -
        timeout: 30s
        check:
          ($error == null): true
    - script:
        # Operator ServiceAccount: Capsule admission denies.
        content: |
          kubectl label namespace preexisting-adoption-test capsule.clastix.io/tenant=edp-workload-krci \
            --as=system:serviceaccount:krci:edp-cd-pipeline-operator
        timeout: 30s
        check:
          ($error != null): true
          (contains($stderr, 'denied the request')): true
    - script:
        # Capsule user with cluster-admin RBAC: RBAC passes, Capsule admission denies.
        content: |
          kubectl label namespace preexisting-adoption-test capsule.clastix.io/tenant=edp-workload-krci \
            --as=adoption-probe --as-group=system:masters --as-group=capsule.clastix.io
        timeout: 30s
        check:
          ($error != null): true
          (contains($stderr, 'denied the request')): true
    - assert:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: preexisting-adoption-test
            (labels."capsule.clastix.io/tenant" == null): true
    cleanup:
    - script:
        content: kubectl delete namespace preexisting-adoption-test --ignore-not-found
        timeout: 1m

  - name: delete-stages-removes-namespaces
    description: |
      Real teardown. The namespaces can only be deleted through the
      capsule-namespace-deleter RoleBinding Capsule places inside them.
      Stages must be deleted highest Spec.Order first; the controller postpones
      deletion of a Stage that still has a parent (stage_controller.go:191).
    try:
    - delete:
        ref:
          apiVersion: v2.edp.epam.com/v1
          kind: Stage
          name: mypipeline-qa
    - delete:
        ref:
          apiVersion: v2.edp.epam.com/v1
          kind: Stage
          name: mypipeline-dev
    - sleep:
        duration: 20s
    - error:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: custom-namespace
    - error:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: krci-mypipeline-dev
