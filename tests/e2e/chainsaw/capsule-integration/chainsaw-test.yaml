apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: capsule-integration
spec:
  steps:
  - name: install-capsule-operator
    try:
    - script:
        content: |
          set -e
          
          helm repo add projectcapsule https://projectcapsule.github.io/charts
          helm repo update

          # Pinned to the version edp-cluster-add-ons ships, so CI exercises what
          # customers run. Bump both together.
          # Since v0.13.0 the chart defaults to cert-manager-issued webhook
          # certs, but cert-manager isn't installed until a later step here -
          # and production (edp-cluster-add-ons) doesn't use cert-manager for
          # Capsule at all. Keep Capsule's own TLS controller, matching prod.
          helm install --replace capsule projectcapsule/capsule --version 0.14.3 \
          --set 'manager.options.users[0].kind=Group' \
          --set 'manager.options.users[0].name=capsule.clastix.io' \
          --set 'manager.options.users[1].kind=Group' \
          --set 'manager.options.users[1].name=system:serviceaccounts:krci' \
          --set 'certManager.generateCertificates=false' \
          --set 'tls.create=true' \
          --set 'tls.enableController=true' \
          --wait \
          --create-namespace \
          --namespace capsule-system
        timeout: 2m  
        check:
          ($error == null): true
    - assert:
        # Verify Capsule Operator
        file: install-capsule-operator-assert.yaml    
    cleanup:
    - script:
        content: |
          set -e
          helm uninstall capsule -n capsule-system

          # `helm uninstall` can return before the chart's cluster-scoped
          # ValidatingWebhookConfiguration/MutatingWebhookConfiguration are
          # actually deleted. In that gap they still intercept namespace
          # create/delete cluster-wide while their backing Service is
          # already gone, breaking whichever suite runs next. Block here
          # until they're verifiably gone instead of trusting the command
          # having returned.
          for i in $(seq 1 30); do
            left=$(kubectl get validatingwebhookconfigurations,mutatingwebhookconfigurations -o name 2>/dev/null | grep -c capsule || true)
            [ "$left" -eq 0 ] && exit 0
            sleep 1
          done
          echo "capsule webhook configurations did not clear in time" >&2
          exit 1
        timeout: 1m
        check:
          ($error == null): true
  - name: install-krci-dependencies
    try:  
    - script:
        content: |
          set -e
          
          # Shared pre-install: the first suite to run pulls the CRDs, the rest
          # skip it. Chainsaw has no global setup hook and test order is not
          # deterministic, so every suite carries the same guarded step.
          if ! kubectl get crd codebases.v2.edp.epam.com >/dev/null 2>&1; then
            base=https://raw.githubusercontent.com/epam/edp-codebase-operator/master/deploy-templates/crds
            kubectl apply -f $base/v2.edp.epam.com_codebaseimagestreams.yaml
            kubectl apply -f $base/v2.edp.epam.com_codebases.yaml
            kubectl apply -f $base/v2.edp.epam.com_gitservers.yaml
          fi
          if ! kubectl get crd applicationsets.argoproj.io >/dev/null 2>&1; then
            kubectl apply -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.9.3/manifests/crds/applicationset-crd.yaml
          fi
        timeout: 30s
    - apply:
        file: krci-config.yaml
        expect:
          - match:
              kind: ConfigMap
              metadata:
                name: krci-config
              data:
                container_registry_host: registry.host.local
                container_registry_space: registry-space
            check:
              ($error == null): true
    - apply:
        file: test-main-cis.yaml
        expect:
          - match:
              kind: CodebaseImageStream
              metadata:
                name: test-main
              spec:
                codebase: test
                imageName: registry.host.local/registry-space/test
                tags:
                  - created: '2023-10-19T14:05:05Z'
                    name: 0.1.0-SNAPSHOT.1
            check:
              ($error == null): true
  - name: install-cert-manager
    try:
    - script:
        content: |
          set -e

          helm status cert-manager -n cert-manager >/dev/null 2>&1 || \
          helm install cert-manager oci://quay.io/jetstack/charts/cert-manager \
            --version v1.20.2 \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --set prometheus.enabled=false \
            --wait
        timeout: 3m
        check:
          ($error == null): true
  - name: install-cd-pipeline-operator
    try:
    - script:
        bindings:
        - name: image_repository
          value: (join('/', [env('CONTAINER_REGISTRY_URL'), env('CONTAINER_REGISTRY_SPACE'), env('E2E_IMAGE_REPOSITORY')]))
        - name: image_tag
          value: (env('E2E_IMAGE_TAG'))
        env:
        - name: IMAGE_REPOSITORY
          value: ($image_repository)
        - name: E2E_IMAGE_TAG
          value: ($image_tag)
        - name: NAMESPACE
          value: ($namespace)
        content: |
          set -e
          helm uninstall cd-pipeline-operator-e2e -n $NAMESPACE --wait 2>/dev/null || true

          helm install --replace --set image.repository=$IMAGE_REPOSITORY \
          --set image.tag=$E2E_IMAGE_TAG \
          --set tenancyEngine=capsule \
          --namespace $NAMESPACE \
          --wait \
          cd-pipeline-operator-e2e ../../../../deploy-templates
        timeout: 3m
        check:
          ($error == null): true
    - assert:
        # Verify Operator Deployment, Tenant, and webhook CA injection
        file: operator-assert.yaml
        timeout: 1m
    cleanup:
    - script:
        env:
        - name: NAMESPACE
          value: ($namespace)
        content: |
          helm uninstall cd-pipeline-operator-e2e -n $NAMESPACE --wait 2>/dev/null || true
        timeout: 2m
  - name: create-cdpipeline-and-stages
    try:  
    # Create CDPipeline and Stages
    - apply:
        file: cdpipeline-and-stages.yaml
    # Wait for CDPipeline and Stages to be processed
    - sleep:
        duration: 30s
    # Verify CDPipeline and Stages
    - assert:
        file: cdpipeline-and-stages-assert.yaml      
  - name: assert-tenant-isolation
    description: |
      Capsule is the isolation engine. The operator must hold no cluster-scoped
      namespace lifecycle rights and no way to grant itself admin outside its
      Tenant. These are the only checks that can fail on over-granting.
    try:
    - script:
        content: |
          set -e
          SA=system:serviceaccount:krci:edp-cd-pipeline-operator
          kubectl create namespace foreign-app --dry-run=client -o yaml | kubectl apply -f -

          deny () {
            got=$(kubectl auth can-i "$@" --as=$SA 2>/dev/null || true)
            if [ "$got" != "no" ]; then
              echo "ESCAPE PATH OPEN: 'kubectl auth can-i $*' returned $got"
              exit 1
            fi
          }
          deny bind clusterroles/admin
          deny create rolebindings --namespace=foreign-app
          deny create secrets --namespace=foreign-app
          deny get secrets --namespace=foreign-app
          deny delete namespaces
          deny delete namespaces/kube-system
        timeout: 1m
        check:
          ($error == null): true
    - script:
        content: |
          set -e
          SA=system:serviceaccount:krci:edp-cd-pipeline-operator
          allow () {
            got=$(kubectl auth can-i "$@" --as=$SA 2>/dev/null || true)
            if [ "$got" != "yes" ]; then
              echo "KRCI MANAGEMENT BROKEN: 'kubectl auth can-i $*' returned $got"
              exit 1
            fi
          }
          allow create rolebindings --namespace=krci-mypipeline-dev
          allow delete namespaces --namespace=krci-mypipeline-dev
        timeout: 1m
        check:
          ($error == null): true
    cleanup:
    - script:
        content: kubectl delete namespace foreign-app --ignore-not-found
        timeout: 1m

  - name: reject-preexisting-namespace-adoption
    description: |
      AC7: with this operator's actual Capsule configuration, nothing can
      bind an already-live namespace to a Tenant via PATCH/UPDATE - not
      the operator's own ServiceAccount, not a declared Tenant owner
      impersonated with the right group, not even cluster-admin RBAC.
      Confirmed against Capsule's source
      (internal/webhook/namespace/mutation/assignment.go,
      tenantForUpdate): that path is gated on user.IsAdmin(), which
      checks CapsuleConfiguration.spec.administrators (Helm value
      manager.options.administrators) - a distinct, stronger grant than
      Tenant.spec.owners, and one this operator's chart/fixture never
      sets. Tenant ownership only ever grants creating a *new*
      namespace pre-bound to that tenant (what
      put_namespace.go/put_openshift_project.go do); it never grants
      adopting an existing one. Verified empirically: adding the probe
      identity to spec.administrators made an otherwise-identical patch
      succeed, isolating this as the actual gate. So: no config change
      to this operator's chart flips this - onboarding a pre-existing
      namespace requires a cluster operator to explicitly add an
      identity to CapsuleConfiguration.spec.administrators out of band
      and perform the migration as that identity; there is no
      in-band/self-service path via this operator.
    try:
    - script:
        content: kubectl create namespace preexisting-adoption-test
        timeout: 30s
    - script:
        content: |
          kubectl label namespace preexisting-adoption-test capsule.clastix.io/tenant=edp-workload-krci
        timeout: 30s
        check:
          # Capsule version emitted it as a warning while allowing the patch,
          # and a non-zero exit alone would pass on any unrelated kubectl
          # failure. Assert the patch was rejected AND rejected for this reason.
          ($error != null): true
          (contains($stderr, 'namespace can not be patched into a tenant')): true
    cleanup:
    - script:
        content: kubectl delete namespace preexisting-adoption-test --ignore-not-found
        timeout: 30s

  - name: delete-stages-removes-namespaces
    description: |
      Real teardown. The namespaces can only be deleted through the
      capsule-namespace-deleter RoleBinding Capsule places inside them.
      Stages must be deleted highest Spec.Order first; the controller postpones
      deletion of a Stage that still has a parent (stage_controller.go:191).
    try:
    - delete:
        ref:
          apiVersion: v2.edp.epam.com/v1
          kind: Stage
          name: mypipeline-qa
    - delete:
        ref:
          apiVersion: v2.edp.epam.com/v1
          kind: Stage
          name: mypipeline-dev
    - sleep:
        duration: 20s
    - error:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: custom-namespace
    - error:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: krci-mypipeline-dev
